version: 2
seeds:
- name: transaction_type_policy
  description: Which transaction types count as outbound money movement to a recipient. Five types qualify. Outgoing P2P
    is included pending Finance sign-off. Change this seed, never a SQL list.
  config:
    column_types:
      transaction_type: varchar
      is_volume_qualifying: boolean
      rationale: varchar
  columns:
  - name: transaction_type
    description: Exact source enum.
    data_type: varchar
    data_tests:
    - unique
    - not_null
  - name: is_volume_qualifying
    description: Whether this type represents outbound movement.
    data_type: boolean
    data_tests:
    - not_null
  - name: rationale
    description: Auditable policy rationale.
    data_type: varchar
    data_tests:
    - not_null
