version: 2
seeds:
- name: transaction_type_policy
  description: Explicit five-type outbound policy; review outgoing P2P scope with Finance. No new recipient_id-not-null
    restriction.
  config:
    column_types:
      transaction_type: varchar
      is_volume_qualifying: boolean
      rationale: varchar
  columns:
  - name: transaction_type
    description: Exact source enum.
    data_type: varchar
    data_tests:
    - unique
    - not_null
  - name: is_volume_qualifying
    description: Whether this type represents outbound movement.
    data_type: boolean
    data_tests:
    - not_null
  - name: rationale
    description: Auditable policy rationale.
    data_type: varchar
    data_tests:
    - not_null
